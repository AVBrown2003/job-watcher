name: daily

on:
  schedule:
    - cron: "0 14 * * *"   # every day, 14:00 UTC = 8:00 AM Central (CST, UTC-6)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull sources, build history, write status, open the day's issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m job_watcher.pipeline
      - name: Commit raw files, history and status
        run: |
          git config user.name "job-watcher[bot]"
          git config user.email "job-watcher@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Daily run $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
